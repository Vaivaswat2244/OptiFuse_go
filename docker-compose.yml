version: '3.9'

# OptiFuse microservices — local development
# All services communicate over gRPC on an internal Docker network.
# Only the gateway exposes a port to the host.

networks:
  optifuse:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    networks: [optifuse]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: optifuse
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: optifuse_db
    volumes:
      # Named volume so the database survives `docker compose down`.
      #
      # Without this, every teardown regenerated each profile's aws_external_id
      # (schema.sql defaults it to uuid_generate_v4()), which silently breaks the
      # CloudFormation trust policy the customer already deployed. The symptom is
      # an AssumeRole 403 that looks like a customer misconfiguration.
      #
      # `docker compose down` keeps named volumes; only `down -v` removes them.
      - optifuse-db-data:/var/lib/postgresql/data
      # No schema mount: the gateway embeds schema.sql and applies it on
      # connect, so compose and Kubernetes create tables the same way.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optifuse -d optifuse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Parser service ──────────────────────────────────────────────────────────
  # Stateless. No credentials. Pure YAML → Graph transform.
  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    networks: [optifuse]
    ports:
      - "50051:50051"   # gRPC (internal only in prod; exposed here for debugging)
      - "9091:9090"     # Prometheus metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Enricher service ────────────────────────────────────────────────────────
  # Requires AWS read credentials (CloudWatch, X-Ray).
  #
  # The customer's role ARN arrives per-request, but assuming it is itself an AWS
  # call: LoadDefaultConfig -> sts:AssumeRole. Their trust policy names the
  # OptiFuse service account as principal, so these must be THAT account's keys —
  # the enricher has to authenticate as OptiFuse before it can borrow a customer
  # role. With no credentials at all the SDK falls through to the EC2 instance
  # metadata service, which does not exist in this container, and blocks for ~5s
  # before failing with "no EC2 IMDS role found".
  enricher:
    build:
      context: .
      dockerfile: services/enricher/Dockerfile
    networks: [optifuse]
    ports:
      - "50052:50052"
      - "9092:9090"     # Prometheus metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50052 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Optimizer service ───────────────────────────────────────────────────────
  # Stateless. No AWS credentials — it never makes an AWS call, it only runs the
  # algorithms and shells out to glpsol. Credentials used to be declared here and
  # not on the enricher, which is exactly backwards.
  # Installs glpk-utils for the MtxILP algorithm.
  optimizer:
    build:
      context: .
      dockerfile: services/optimizer/Dockerfile
    networks: [optifuse]
    ports:
      - "50053:50053"
      - "9093:9090"     # Prometheus metrics
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50053 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Deployer service ────────────────────────────────────────────────────────
  # Requires AWS write credentials (Lambda, CloudFormation, S3).
  # Needs Node.js + Serverless Framework installed to run `serverless deploy`.
  # deployer:
  #   build:
  #     context: .
  #     dockerfile: services/deployer/Dockerfile
  #   networks: [optifuse]
  #   ports:
  #     - "50054:50054"
  #   healthcheck:
  #     test: ["CMD", "grpc_health_probe", "-addr=:50054"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3

  # ── API Gateway ─────────────────────────────────────────────────────────────
  # The only service exposed to the outside world.
  # Speaks REST/JSON to the Next.js frontend and gRPC to internal services.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    networks: [optifuse]
    ports:
      - "8080:8080"   # REST API — frontend points here
      - "9094:9090"   # Prometheus metrics (never exposed publicly in prod)
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PARSER_ADDR=parser:50051
      - ENRICHER_ADDR=enricher:50052
      - OPTIMIZER_ADDR=optimizer:50053
      - DATABASE_URL=${DATABASE_URL}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - CLIENT_ORIGIN_URL=${CLIENT_ORIGIN_URL}
    depends_on:
      parser:
        condition: service_healthy
      enricher:
        condition: service_healthy
      optimizer:
        condition: service_healthy
      # deployer:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  optifuse-db-data:
