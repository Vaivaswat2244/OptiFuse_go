# ClusterIssuers tell cert-manager which ACME server to use and how to prove
# control of a name. Two, because Let's Encrypt production rate-limits failed
# validations (5 per hostname per hour). When debugging a certificate that will
# not issue, point the Ingress at staging first: unlimited, but its certs are
# signed by an untrusted root, so browsers warn.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: vaivaswat2244@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: vaivaswat2244@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
