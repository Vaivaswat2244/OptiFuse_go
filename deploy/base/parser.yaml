# Parser: stateless YAML-to-graph transform. No credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: parser
  template:
    metadata:
      labels:
        app: parser
    spec:
      # Matches the code: 2s drain after SIGTERM, then up to 25s of
      # GracefulStop. Kubernetes sends SIGKILL when this runs out.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the "optifuse" user created in the Dockerfile
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parser
          image: ghcr.io/vaivaswat2244/optifuse-parser
          ports:
            - name: grpc
              containerPort: 50051
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: optifuse-config
          env:
            - name: PORT
              value: "50051"
          # Native gRPC probes call grpc.health.v1.Health/Check with service "",
          # which is the status grpcserver sets. Readiness decides whether the
          # Service sends this pod traffic; liveness decides whether to restart
          # it. After SIGTERM the server reports NOT_SERVING, readiness fails,
          # and the pod leaves the endpoints while it drains.
          readinessProbe:
            grpc:
              port: 50051
            periodSeconds: 5
          livenessProbe:
            grpc:
              port: 50051
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: parser
spec:
  selector:
    app: parser
  ports:
    - name: grpc
      port: 50051
    - name: metrics
      port: 9090
